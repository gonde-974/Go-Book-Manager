<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Book Manager</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <nav>
        <h1>📚 Book Manager</h1>
    </nav>

    <section>
        <!-- Add a book form -->
        <form hx-post="/add" hx-target="#book-list" hx-swap="outerHTML" hx-on="htmx:afterSwap: clearForm()">
            <input type="text" name="title" id="title" placeholder="Title" required>
            <input type="text" name="author" id="author" placeholder="Author" required>
            <input type="number" name="year" id="year" placeholder="Year" required>
            <button type="submit">➕ Add</button>
        </form>
    </section>

    <section>
        <!-- Search form -->
        <form hx-get="/search" hx-target="#book-list" hx-swap="outerHTML">
            <input type="text" name="author" placeholder="Search by author...">
            <button type="submit">🔍 Search</button>
        </form>
    </section>

    <section id="book-list">
        {{ template "list.html" . }}
    </section>

    <script>
        // Clear the form fields after submission
        function clearForm() {
            document.getElementById('title').value = '';
            document.getElementById('author').value = '';
            document.getElementById('year').value = '';
        }
    </script>
</body>

</html>
