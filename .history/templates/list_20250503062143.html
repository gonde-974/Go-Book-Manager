<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody>
        {{ range . }}
        <tr>
            <td>{{ .Title }}</td>
            <td>{{ .Author }}</td>
            <td>{{ .Year }}</td>
            <td>
                <form hx-post="/delete" hx-target="#book-list" hx-swap="outerHTML">
                    <input type="hidden" name="id" value="{{ .ID }}">
                    <button type="submit">❌</button>
                </form>
            </td>
        </tr>
        {{ end }}
    </tbody>
</table>
